plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.decadence.campaign'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.decadence.campaign'
        minSdk 26          // java.util.Base64 ve Long.remainderUnsigned için
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            // Oyun çekirdeği repo kökündeki core/ modülünde; Android'e ayrı kütüphane olarak değil kaynak olarak eklenir.
            java.srcDirs += '../../core/src/main/java'
        }
    }
}
